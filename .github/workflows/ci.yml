# Pipeline do projeto: roda em todo PR e em todo push na main.
# Os testes entram aqui automaticamente: qualquer tests/**/test_*.py é descoberto pelo pytest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar o projeto e as ferramentas
        run: python -m pip install -e ".[dev]"
      - name: Lint e formatação (ruff)
        run: make lint PY=python
      - name: Tipos (mypy strict, código e testes)
        run: make tipos PY=python

  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"] # mínimo suportado e a versão usada pela equipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar o projeto e as ferramentas
        run: python -m pip install -e ".[dev]"
      - name: Todos os testes (unidade, integração, arquitetura e lentos) + cobertura mínima de 90%
        run: make cobertura PY=python
      - name: Resumo da cobertura na página da execução
        if: always()
        run: |
          {
            echo "### Cobertura (Python ${{ matrix.python-version }})"
            echo '```'
            sed -n '/coverage: platform/,$p' resultados/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: |
            resultados/cobertura.txt
            resultados/cobertura/

  exige-testes:
    name: PR traz testes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Código alterado em src/ precisa vir com teste alterado em tests/
        env:
          BASE: ${{ github.base_ref }}
        run: .github/scripts/exige-testes.sh "origin/${BASE}" HEAD
